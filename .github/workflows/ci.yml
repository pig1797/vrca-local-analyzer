name: Local core checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extractor dependency
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q analyze.py local_web.py python tests
      - name: Install Linux codec build dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y liblzma-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Install Windows liblzma runtime for codec tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $codecVcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          & $codecVcpkg install liblzma:x64-windows
          if ($LASTEXITCODE -ne 0) { throw 'liblzma build failed' }
          $codecDlls = @(Get-ChildItem (Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows/bin') -Filter '*lzma*.dll')
          if ($codecDlls.Count -ne 1) { throw 'expected one release liblzma DLL' }
          Copy-Item -LiteralPath $codecDlls[0].FullName -Destination bin/liblzma-5.dll
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
